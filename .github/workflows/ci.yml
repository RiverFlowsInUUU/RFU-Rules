name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # 允许手动重跑，不必为触发 CI 而空提交

# 最小权限：本工作流只读代码，不写仓库、不发 release。
# 不声明时 GITHUB_TOKEN 走仓库默认（对 push 事件偏宽），"用多少给多少"更稳妥。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 负样本并发 4 路约 26s，15 分钟是充分裕量；防 runner 卡死占资源
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: ① 上游快照完整性（upstream/ vs manifest.json 的 sha256）
        # 构建不联网：六个源全部入库在 upstream/，产物只由它们生成。
        # 这一步确认快照没被手改 —— 手改上游等于悄悄换掉合并基线，
        # 而 ② 只会照着被改过的源重跑、照样全绿，只有这里能发现。
        # 失败即整步失败，不借 SKIP 蒙混（未验证 ≠ 绿）。
        run: python skill/scripts/freeze_upstream.py --check

      - name: ② 一致性断言（16 段 · 三格式等价 / 条数声明 / 产物可复现 / 快照自述）
        # 退出码：0=过 / 1=判负 / 2=环境不达标 / 3=SKIP（缺 upstream/ 快照）。
        # 上游已冻结、快照已入库，所以第 6 段在 CI 上一定真正执行；
        # 出现 3 说明有人删了 upstream/ —— 视为失败。
        run: |
          set +e
          python skill/tests/verify_products.py
          code=$?
          set -e
          echo "verify_products.py exit=$code"
          if [ "$code" -ne 0 ]; then
            echo "::error::一致性断言未通过（exit $code）—— 2/3 视为失败：判据没有真正跑起来"
            exit 1
          fi

      - name: ③ 负样本自测（证明闸门本身能抓错，防空转）
        # 一个只会全绿的闸门等于没有闸门。这一步在临时副本仓里制造 23 种典型错误
        # （手改产物 / 只改表头 / 跨格式差异 / 文档漂移 / 源头改了没重跑 / 文案违规 /
        #  平台清单缺一端 ×2 / 表格 emoji 宽度 / 源与产物半同步 / 文档版本号漂移 /
        #  残缺上游快照 / 手改 upstream 快照 / 重叠清单计数与逐条 ×2 / 瘦身留痕摘要与漏行 ×2 /
        #  段号引用指向不存在的段标 / 段数声明漂移 / 段数声明逃逸（未登记 DECL_FILES）/
        #  负样本计数漂移 / 投毒熔断失效），
        #  逐一要求 ② 判负 —— 全部抓到才算过。
        # ⚠️ 它要求先有绿基线：② 红了这里会拒绝出结论（exit 2）。
        # ⚠️ 这里的数字由 verify 第 13 段④型守护：与 @case 实数不符会判红，别手滑。
        run: python skill/tests/selftest_negative.py
