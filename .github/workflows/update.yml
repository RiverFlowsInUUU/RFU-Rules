name: Upstream refresh

# 每周把六个上游源里的「活源」拉到最新并重建产物。
#
# 分工：
#   ci.yml     —— 校验仓内快照与产物的一致性（不联网，可复现）
#   本工作流   —— 唯一联网换血的入口（跑 freeze_upstream.py + regen.sh）
#
# 边界：jinx 钉死在 3.2.3（上游 3.2.4 起加密发布，JINX_COMMIT 不动），
# 其余源拉最新。抓取失败 ⇒ freeze 退出码 1 ⇒ 本工作流失败 ⇒ 不提交，
# 仓内永远不出现「半新半旧」的快照。

on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC（北京时间 11:00）
  workflow_dispatch:       # 手动触发，随时可补跑

# 有 diff 时要把快照与产物提交回 main，失败时要自动开 issue 报警（v11 审查 3.2：
# 无人值守的周更若静默失败，上游数据会悄然老化数周无人知），故需要写权限。
permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-refresh
  cancel-in-progress: false   # 上一次刷新没跑完就等它，不互相踩

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # freeze 拉源 + regen 双闸门，15 分钟充分裕量
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: ① 拉取上游最新（jinx 保持 3.2.3 钉死）
        run: python skill/scripts/freeze_upstream.py

      - name: ② 重跑六份产物 + 双闸门
        # regen 自带：快照校验 → direct → ads → 六份产物 → verify + selftest。
        # 任何一步判负都会让本步失败，后面的提交不会执行。
        run: bash skill/scripts/regen.sh

      - name: ③ 有 diff 才提交（无 diff 静默结束，不空转）
        run: |
          git config user.name  "rfu-updater"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "上游无变化，零 diff，不提交"
          else
            git commit -m "⬆️ 上游快照周更 $(date -u +%F)（jinx 保持 3.2.3 钉死）"
            git push
          fi

      - name: ④ 失败报警（自动开 issue；已有未闭合报警则追加评论）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="周更工作流失败"
          open_num=$(gh issue list --search "$MARKER in:title state:open" \
            --json number --jq '.[0].number // empty')
          body="**运行**：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          **时间**：$(date -u '+%F %T UTC')
          上游抓取 / 重建 / 闸门任一环节失败。仓库快照保持上一次成功状态（不提交半新半旧），
          但数据已停止老化更新 —— 请查看 Actions 日志定位失败源。"
          if [ -n "$open_num" ]; then
            gh issue comment "$open_num" --body "$body"
          else
            gh issue create --title "⏰ $MARKER（$(date -u +%F)，待排查）" --body "$body"
          fi

      - name: ⑤ 成功后闭合历史报警（有则关，无则跳过）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_num=$(gh issue list --search "周更工作流失败 in:title state:open" \
            --json number --jq '.[0].number // empty')
          if [ -n "$open_num" ]; then
            gh issue close "$open_num" --comment "本次周更已恢复正常，自动闭合。"
          else
            echo "无未闭合报警"
          fi
